name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare redesigned website
        run: |
          test -f delo-est-site-redesign.zip
          mkdir -p extracted public
          unzip -q delo-est-site-redesign.zip -d extracted
          python3 -m pip install --quiet pillow
          python3 patch_site_relaunch.py extracted/delo-est-site
          python3 patch_site_theme_cycle.py extracted/delo-est-site
          python3 patch_site_cardfix.py extracted/delo-est-site
          python3 brand_assets_relaunch.py site extracted/delo-est-site
          cp -a extracted/delo-est-site/. public/
          test -f public/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
